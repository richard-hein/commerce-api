
spring:
  application:
    name: commerce-api

  datasource:
    url: jdbc:postgresql://localhost:5433/commerce_db
    username: commerce_user
    password: commerce_dev_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
#    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
