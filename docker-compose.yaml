services:
  postgres:
    image: postgres:17
    container_name: commerce-postgres
    environment:
      POSTGRES_DB: commerce_db
      POSTGRES_USER: commerce_user
      POSTGRES_PASSWORD: commerce_dev_password

    ports:
      - "5433:5432"
    volumes:
      - commerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_user -d commerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  commerce_data:
